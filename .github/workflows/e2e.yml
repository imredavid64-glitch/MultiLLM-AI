name: E2E Demo Flow

# Manually triggered only -- not run on every push/PR (see ci-cd.yml for
# that). These tests hit a real deployed app (E2E_BASE_URL) with a real test
# account, not a mocked/local stack, so they're opt-in: run from the Actions
# tab against staging (or any other deployed environment) when you want to
# verify the demo flow end to end.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to run against (e.g. your staging deployment)'
        required: true
        default: 'http://localhost:3000'

env:
  NODE_VERSION: '24.x'

jobs:
  e2e:
    name: Playwright Demo Flow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vercel-deployment
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vercel-deployment/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run demo flow
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vercel-deployment/playwright-report/
          retention-days: 14
