name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  # vitest 5 requires Node >=22.12 at runtime (not just types) -- bumped
  # from 20.x when the Next.js test suite was added. Next.js 16 itself only
  # requires >=20.9, so this is driven by the test tooling, not the app.
  NODE_VERSION: '24.x'
  PYTHON_VERSION: '3.12'

jobs:
  # Python tests and linting
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install openai httpx torch numpy pytest pytest-cov black ruff mypy
      
      - name: Run Python linting (ruff)
        run: |
          ruff check . --exclude=vercel-deployment
      
      - name: Run Python formatting check (black)
        run: |
          black --check . --exclude=vercel-deployment
      
      - name: Run Python type checking (mypy)
        run: |
          mypy ai_client.py local_models.py train/ token_optimizer.py --ignore-missing-imports

      - name: Run Python tests
        run: |
          pytest -v

  # Next.js build and test
  nextjs-build:
    name: Next.js Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vercel-deployment
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vercel-deployment/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint
      
      - name: Run type checking
        run: npm run typecheck
      
      - name: Run build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
      
      - name: Run tests
        run: npm test --if-present

  # Python function tests
  python-functions-test:
    name: Python Functions Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vercel-deployment/api/query-ensemble
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
          pip install pytest httpx
      
      - name: Test function imports
        run: |
          python -c "from main import app; print('Import OK')"
      
      - name: Test health endpoint
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -f http://localhost:8000/api/health
          kill %1

  # vercel-deployment/api/query-ensemble/{ai_client,local_models,token_optimizer}.py
  # are manually-maintained vendored copies of the repo-root originals (see
  # "VENDORED COPY" comment at the top of each) -- Vercel's Root Directory
  # for this project can't reach files above it. Nothing enforces the two
  # staying in sync, so a copy can silently drift. Catch that here instead
  # of in production.
  vendored-files-check:
    name: Vendored Files In Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diff vendored copies against their repo-root originals
        run: |
          set -e
          # The vendored copy's header isn't a clean, identically-styled
          # block across files: ai_client.py prepends plain "#" comment
          # lines (clean prefix), but local_models.py/token_optimizer.py
          # splice extra lines into the leading docstring, which moves the
          # opening `"""` onto its own line -- the first real content line
          # is otherwise identical but differs by that one quote mark.
          # Compare by length (vendored should be exactly the root file's
          # header longer, its last N lines = root's N lines) and strip `"`
          # before diffing so that one-character docstring-reflow quirk
          # doesn't count as drift, while any real content change (which
          # would still differ character-for-character elsewhere) still
          # fails the build.
          check_vendored() {
            local root_file="$1" vendored_file="$2"
            local root_lines
            root_lines=$(wc -l < "$root_file")
            if ! diff -q <(tr -d '"' < "$root_file") <(tail -n "$root_lines" "$vendored_file" | tr -d '"') > /dev/null; then
              echo "::error::$vendored_file has diverged from $root_file beyond its VENDORED COPY header. Re-sync it manually."
              diff "$root_file" <(tail -n "$root_lines" "$vendored_file") || true
              exit 1
            fi
            echo "OK: $vendored_file's last $root_lines lines match $root_file."
          }

          check_vendored ai_client.py vercel-deployment/api/query-ensemble/ai_client.py
          check_vendored local_models.py vercel-deployment/api/query-ensemble/local_models.py
          check_vendored token_optimizer.py vercel-deployment/api/query-ensemble/token_optimizer.py

  # Training function tests: skipped. training-job is excluded from
  # deployment (vercel-deployment/training-job-disabled/, not under api/ --
  # see its DISABLED.md), so there's nothing deployed here to test, and the
  # old working-directory (./vercel-deployment/api/training-job) no longer
  # exists -- this job would fail on checkout alone. Restore alongside
  # DISABLED.md's restore steps if the function is ever re-enabled.

  # Deployment is handled by Vercel's own GitHub integration (auto-deploys
  # on push to main), which doesn't need a stored VERCEL_TOKEN here and was
  # actually deploying successfully while this job -- lacking that secret --
  # failed on every run. Removed rather than wired up, to avoid two
  # deployment paths for the same project.

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run npm audit
        run: |
          cd vercel-deployment
          npm audit --audit-level=high

      - name: Run pip-audit
        run: |
          pip install pip-audit
          # Scoped to our own requirements.txt -- a bare `pip-audit` audits
          # every package in the environment, which on this runner image
          # includes Ubuntu's own system/cloud-init tooling (cloud-init,
          # ubuntu-pro-client, walinuxagent, bcc, ...). Those aren't this
          # project's dependencies and aren't ours to patch; scoping avoids
          # failing the build on vulnerabilities we have no way to fix.
          pip-audit -r requirements.txt

  # Reject commits containing real secrets or unresolved config placeholders
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed secrets
        run: |
          set -e
          PATTERN='sk-[A-Za-z0-9]{20,}|sk-or-v1-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}'
          # tests/ is excluded: it deliberately contains fake, secret-shaped
          # strings as fixtures for testing redact_sensitive()/detect_sensitive_hits().
          if grep -rEn --binary-files=without-match \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
              --exclude-dir=models --exclude-dir=tests --exclude='package-lock.json' \
              -E "$PATTERN" . ; then
            echo "::error::Potential secret detected in the repository (see matches above)."
            exit 1
          fi
          echo "No secret-shaped strings found."

      - name: Reject unresolved placeholder values in committed config
        run: |
          set -e
          if grep -rEn "your-appwrite-instance\.com|your-project-id|your-api-key|your-vercel-app\.vercel\.app" --include='vercel.json' . ; then
            echo "::error::Placeholder values found in committed vercel.json -- replace with real env var references before deploying."
            exit 1
          fi
          echo "No unresolved placeholders found."

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    needs: [python-test, nextjs-build, python-functions-test, vendored-files-check, security-scan, secret-scan]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Build failed! Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"Build failed!"}' $SLACK_WEBHOOK_URL